# DIAL simple setup: Chat + Admin + Core + local/cloud models + sample apps and interceptor.
# Start:  docker compose up --wait      Stop:  docker compose down
#
# Both setups share the Compose project name "dial", so ../2-dial-advanced-setup
# upgrades this stack in place and reuses its downloaded models and users.
# They also share DIAL Core's folders in the repository root:
#   ../core       Core configuration
#   ../core-data  Core storage: chats, files, resources created in Admin
#   ../logs       Core request logs
#
# The Chat and Admin images are published for linux/amd64 only. On an Apple
# Silicon Mac, set DIAL_PLATFORM=linux/amd64 in .env so Docker runs them through
# emulation. The other images have ARM builds and run natively.
name: dial

services:

  # DIAL Chat: the web UI, http://localhost:8055
  chat:
    image: epam/ai-dial-chat:${DIAL_CHAT_VERSION:-1.2.14}
    platform: ${DIAL_PLATFORM:-}
    restart: unless-stopped
    ports: ["127.0.0.1:${DIAL_CHAT_PORT:-8055}:5000"]
    environment:
      PORT: "5000"
      DIAL_CORE_URL: http://core:8080
      THEMES_CONFIG_URL: http://themes:8080
      DEFAULT_DEPLOYMENT: ${DEFAULT_DEPLOYMENT:-ollama-qwen2.5}
      AUTH_CALLBACK_BASE_URL: http://localhost:${DIAL_CHAT_PORT:-8055}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      AUTH_COOKIE_SECURE: "false"
      CORS_ORIGIN: http://localhost:${DIAL_CHAT_PORT:-8055}
      AUTH_KEYCLOAK_HOST: http://keycloak.localhost:${KC_PORT:-8058}/realms/dial
      AUTH_KEYCLOAK_CLIENT_ID: dial-chat
      AUTH_KEYCLOAK_SECRET: ${AUTH_KEYCLOAK_SECRET:-keycloak_secret}
      DIAL_ROLES_FIELD: roles
      ADMIN_ROLE_NAMES: admin
    depends_on:
      core:
        condition: service_healthy
      core-config-apply:
        condition: service_completed_successfully
      themes:
        condition: service_started
      model-provider:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      essay-assistant-app:
        condition: service_healthy
      agent-app-sample:
        condition: service_healthy
      pre-post-interceptor:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:5000/api/health', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Admin UI talking directly to Core (no Admin Backend), http://localhost:8056
  admin-frontend:
    image: epam/ai-dial-admin-frontend:${DIAL_ADMIN_FRONTEND_VERSION:-0.22.1}
    platform: ${DIAL_PLATFORM:-}
    restart: unless-stopped
    ports: ["127.0.0.1:${DIAL_ADMIN_FRONTEND_PORT:-8056}:3000"]
    environment:
      # Leave DIAL_ADMIN_API_URL unset: use the Core-direct UI.
      DIAL_CORE_API_URL: http://core:8080
      DIAL_LINK: http://localhost:${DIAL_CHAT_PORT:-8055}
      ANALYTICS_ENABLED: "false"
      NEXTAUTH_URL: http://localhost:${DIAL_ADMIN_FRONTEND_PORT:-8056}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-local-development-nextauth-secret-change-me}
      NEXTAUTH_COOKIE_PREFIX: admin
      AUTH_KEYCLOAK_HOST: http://keycloak.localhost:${KC_PORT:-8058}/realms/dial
      AUTH_KEYCLOAK_CLIENT_ID: dial-admin-console
      AUTH_KEYCLOAK_SECRET: ${AUTH_KEYCLOAK_SECRET:-keycloak_secret}
      AUTH_KEYCLOAK_ADMIN_ROLE_NAMES: ConfigAdmin,admin
      AUTH_KEYCLOAK_DIAL_ROLES_FIELD: roles
      THEMES_CONFIG_URL: http://themes:8080
      # These menus need the Admin Backend, which is not deployed.
      DISABLE_MENU_ITEMS: entities builders accessmanagement audit
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      core:
        condition: service_healthy
      core-config-apply:
        condition: service_completed_successfully
      themes:
        condition: service_started
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/api/health', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Colors, logos and model icons for Chat and Admin
  themes:
    image: epam/ai-dial-chat-themes:${DIAL_THEMES_VERSION:-0.21.0}
    restart: unless-stopped
    ports: ["127.0.0.1:${DIAL_THEMES_PORT:-8063}:8080"]

  # DIAL Core: the API gateway in front of every model and application, http://localhost:8059
  core:
    image: epam/ai-dial-core:${DIAL_CORE_VERSION:-0.49.4}
    restart: unless-stopped
    ports: ["127.0.0.1:${DIAL_CORE_PORT:-8059}:8080"]
    environment:
      # Server settings, and where Core writes its request logs (/app/log).
      AIDIAL_SETTINGS: /opt/config/settings.json
      JAVA_OPTS: -Dgflog.config=/opt/config/gflog.xml
      # Core reads only the admin key from a file; core-config-apply stores the other entities.
      aidial.config.files: '["/opt/config/admin-key.json"]'
      # List custom applications in Chat.
      aidial.applications.includeCustomApps: "true"
      # Users sign in with Keycloak; Core validates their tokens.
      aidial.identityProviders.keycloak.jwksUrl: http://keycloak:${KC_PORT:-8058}/realms/dial/protocol/openid-connect/certs
      aidial.identityProviders.keycloak.rolePath: roles
      aidial.identityProviders.keycloak.loggingKey: sub
      aidial.identityProviders.keycloak.loggingSalt: ${DIAL_CORE_LOGGING_SALT:-local-development-logging-salt}
      aidial.access.admin.rules: '[{"source":"roles","function":"EQUAL","targets":["admin"]}]'
      aidial.encryption.secret: ${DIAL_CORE_ENCRYPTION_SECRET:-local-development-salt}
      aidial.encryption.key: ${DIAL_CORE_ENCRYPTION_KEY:-local-development-encryption-key}
      aidial.redis.singleServerConfig.address: redis://redis:6379
      # Conversations and files are stored in /app/data.
      aidial.storage.provider: filesystem
      aidial.storage.prefix: core
      aidial.storage.bucket: dial
      aidial.storage.createBucket: "true"
      aidial.storage.overrides: '{"jclouds.filesystem.basedir":"/app/data"}'
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    # Lets Core reach sample entities running in a local debugger.
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ../core:/opt/config:ro
      - ../core-data:/app/data
      - ../logs:/app/log
    healthcheck:
      test: [CMD-SHELL, "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # Copies every model, application, interceptor, API key and role of both setups
  # (../core/config.json and ../core/scheduler.json) into Core's storage, then exits.
  # Each file is applied once and listed in ../core-data/core-config-apply.json;
  # later starts skip it, so changes made in DIAL Admin are kept. See ../core/README.md.
  core-config-apply:
    build: ../core/config-apply
    # Always use the importer shipped with this checkout, including on upgrades.
    pull_policy: build
    environment:
      CORE_URL: http://core:8080
      # The admin key from ../core/admin-key.json.
      API_KEY: dial_admin_api_key
      CONFIG_FILES: core/config.json core/scheduler.json
      STATE_FILE: core-data/core-config-apply.json
    volumes:
      - ../core:/dial/core:ro
      - ../core-data:/dial/core-data
    depends_on:
      core:
        condition: service_healthy
    restart: "no"

  # Cache used by Core
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: [redis-server, --maxmemory, 512mb, --maxmemory-policy, volatile-lfu, --save, "", --appendonly, "no", --loglevel, warning]
    mem_limit: 640M
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  # One process for OpenAI-compatible, Bedrock, Vertex AI and DIAL models
  model-provider:
    image: epam/ai-dial-model-provider:${DIAL_MODEL_PROVIDER_VERSION:-0.1.0-rc.0}
    restart: unless-stopped
    environment:
      DIAL_URL: http://core:8080
      LOG_LEVEL: INFO
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_ASSUME_ROLE_ARN: ${AWS_ASSUME_ROLE_ARN:-}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCP_DEFAULT_REGION: ${VERTEXAI_REGION:-us-central1}
      GOOGLE_APPLICATION_CREDENTIALS: /opt/credentials/google.json
    volumes: ["./credentials:/opt/credentials:ro"]
    healthcheck:
      test: [CMD-SHELL, "wget -q --spider http://127.0.0.1:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ---------------------------------------------------------------------------
  # DIAL entity samples: your own code, built from ./dial_entity_samples
  # ---------------------------------------------------------------------------

  # Application "Essay Assistant": writes short essays with ollama-qwen2.5 through Core.
  essay-assistant-app:
    build: ./dial_entity_samples/essay_assistant_app
    restart: unless-stopped
    environment:
      DIAL_URL: http://core:8080
      DIAL_MODEL: ollama-qwen2.5
    depends_on:
      core:
        condition: service_healthy
      model-provider:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:5026/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Application "AI Agent Sample": web search and picture analysis, http://localhost:8065
  agent-app-sample:
    build: ./dial_entity_samples/agent_app_sample
    restart: unless-stopped
    ports: ["127.0.0.1:${AGENT_APP_PORT:-8065}:5025"]
    environment:
      DIAL_URL: http://core:8080
      AGENT_MODEL: ${AGENT_MODEL:-ollama-qwen2.5}
      VISION_MODEL: ${VISION_MODEL:-ollama-llava-vision}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-300}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:5025/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Interceptor "pre-post-interceptor": adds stages before and after a model's answer.
  # Core calls it for the "qwen2.5 + pre/post interceptor" model; it has no published port.
  pre-post-interceptor:
    build: ./dial_entity_samples/pre_post_interceptor_sample
    restart: unless-stopped
    environment:
      DIAL_URL: http://core:8080
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:5041/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Runs open-source models on your computer (CPU), http://localhost:8064
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports: ["127.0.0.1:${OLLAMA_PORT:-8064}:11434"]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # One model at a time: models running side by side fight over the same CPU cores.
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
    volumes: ["ollama-data:/root/.ollama"]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 5s
      timeout: 5s
      retries: 20

  # Downloads the models into Ollama, then exits.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        for model in $${MODELS_TO_PULL}; do
          # When offline, keep using a model that was downloaded before.
          ollama pull "$$model" || ollama show "$$model" > /dev/null
        done
    environment:
      OLLAMA_HOST: http://ollama:11434
      # Must match the "overrideName" values in ../core/config.json.
      MODELS_TO_PULL: >-
        ${OLLAMA_CHAT_MODEL:-qwen2.5:0.5b}
        ${OLLAMA_SECOND_CHAT_MODEL:-llama3.2:1b}
        ${OLLAMA_EMBEDDING_MODEL:-all-minilm}
        ${OLLAMA_VISION_MODEL-llava}
    restart: "no"

  # Sign-in (users and passwords), admin console: http://keycloak.localhost:8058/admin
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    restart: unless-stopped
    platform: ${DIAL_PLATFORM:-}
    command: [start-dev, --import-realm, "--http-port=${KC_PORT:-8058}", --hostname-backchannel-dynamic=true]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin-password}
      KC_HOSTNAME: http://keycloak.localhost:${KC_PORT:-8058}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      # The shared realm pre-registers the advanced editor client for upgrades too.
      DIAL_CHAT_URL: http://localhost:${DIAL_CHAT_PORT:-8055}
      DIAL_ADMIN_URL: http://localhost:${DIAL_ADMIN_FRONTEND_PORT:-8056}
      DIAL_QUICKAPPS_URL: http://localhost:${QUICKAPPS_FRONTEND_PORT:-8057}
      AUTH_KEYCLOAK_SECRET: ${AUTH_KEYCLOAK_SECRET:-keycloak_secret}
      DIAL_USER_PASSWORD: ${DIAL_USER_PASSWORD:-dial}
    ports: ["127.0.0.1:${KC_PORT:-8058}:${KC_PORT:-8058}"]
    networks:
      default:
        # Browsers and containers reach Keycloak by the same name.
        aliases: [keycloak.localhost]
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/realm-config.json:/opt/keycloak/data/import/realm-config.json:ro
    healthcheck:
      test: [CMD, bash, -ec, "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  keycloak-data:
  ollama-data:
