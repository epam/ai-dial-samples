# Changes that the advanced setup makes to services of the simple setup.
# docker-compose.yml merges this file into ../1-dial-simple-setup/docker-compose.yml.
#
# Docker Compose reads this file as part of 1-dial-simple-setup: a relative path
# here would start from that folder, not from this one.
services:

  chat:
    environment:
      ALLOWED_IFRAME_ORIGINS: http://localhost:${QUICKAPPS_FRONTEND_PORT:-8057}
      SCHEDULED_TASKS_ENABLED: "true"
      SCHEDULER_APP_ID: public/dial_scheduler
      SCHEDULER_SERVICE_ID: dial-native
    depends_on:
      scheduler:
        condition: service_healthy
      quickapps-frontend:
        condition: service_healthy

  # Admin is inherited from the simple setup; these backends are advanced-only.
  admin-frontend:
    environment:
      DIAL_EVAL_API_URL: http://evaluation-backend:8080
      ANALYTICS_ENABLED: "true"
      ANALYTICS_USAGE_ENABLED: "true"
      ANALYTICS_SESSIONS_ENABLED: "true"
      DIAL_ANALYTICS_API_URL: http://analytics:5000
      DIAL_ANALYTICS_RUNNER_API_URL: http://analytics-enrichment-runner:5000
      DIAL_QUERY_ASSISTANT_DEPLOYMENT: ${DIAL_QUERY_ASSISTANT_DEPLOYMENT:-}
    depends_on:
      evaluation-backend:
        condition: service_healthy
      analytics-init:
        condition: service_completed_successfully
      analytics-enrichment-runner:
        condition: service_healthy

  core:
    environment:
      aidial.config.files: '["/opt/config/admin-key.json", "/opt/config/quick-apps-schemas.json"]'
      # Reuse the existing confidential Chat client; its tokens carry Chat roles.
      aidial.identityProviders.keycloak.offlineClient.clientId: dial-chat
      aidial.identityProviders.keycloak.offlineClient.clientSecret: ${AUTH_KEYCLOAK_SECRET:-keycloak_secret}
      aidial.identityProviders.keycloak.offlineClient.authorizationEndpoint: http://keycloak.localhost:${KC_PORT:-8058}/realms/dial/protocol/openid-connect/auth
      aidial.identityProviders.keycloak.offlineClient.tokenEndpoint: http://keycloak:${KC_PORT:-8058}/realms/dial/protocol/openid-connect/token
      aidial.identityProviders.keycloak.offlineClient.redirectUri: http://localhost:${DIAL_CHAT_PORT:-8055}/auth/toolset-signin
      # Sessions and Evaluation need client/session metadata from request headers.
      aidial.analytics.collectHeaders: "true"
      aidial.analytics.headersAllowlist: >-
        ["user-agent", "baggage", "x-dial-cli-version", "x-dial-client-channel-id",
        "x-session-id", "thread-id", "anthropic-client-platform",
        "x-claude-code-agent-id", "x-claude-code-session-id"]
    depends_on:
      # Core fetches the Quick Apps schema at startup.
      quickapps-backend:
        condition: service_healthy
