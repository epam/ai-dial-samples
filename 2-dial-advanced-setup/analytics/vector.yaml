data_dir: /var/lib/vector

sources:
  core_logs:
    type: file
    include: [/app/log/*.log]
    read_from: beginning
    oldest_first: true
    max_line_bytes: 100000000

sinks:
  analytics:
    type: azure_blob
    inputs: [core_logs]
    connection_string: "DefaultEndpointsProtocol=http;AccountName=dialanalytics;AccountKey=${ANALYTICS_BLOB_KEY};BlobEndpoint=http://dialanalytics.analytics-blob:10000;"
    container_name: logs
    blob_prefix: "logs/%Y/%m/%d/"
    blob_time_format: "%s"
    compression: gzip
    acknowledgements:
      enabled: true
    encoding:
      # Core already writes JSON lines; do not wrap them in a Vector event.
      codec: text
    framing:
      method: newline_delimited
    batch:
      max_bytes: 1049000
      timeout_secs: 5
    request:
      timeout_secs: 300
    buffer:
      type: disk
      max_size: 268435488
      when_full: block
